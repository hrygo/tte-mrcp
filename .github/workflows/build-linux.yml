name: Build and Verify Linux Packages

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact_naming:
    name: Compute artifact naming
    runs-on: ubuntu-24.04
    outputs:
      artifact_suffix: ${{ steps.naming.outputs.artifact_suffix }}
    steps:
      - name: Compute artifact suffix
        id: naming
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            safe_ref="$(printf '%s' "$GITHUB_REF_NAME" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')"
            [ -n "$safe_ref" ] || safe_ref=release
            suffix="release-${safe_ref}-${GITHUB_SHA:0:12}"
          fi
          printf 'artifact_suffix=%s\n' "$suffix" >> "$GITHUB_OUTPUT"

  build-linux:
    name: ${{ matrix.target }}
    needs: artifact_naming
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: rhel7-x86_64
            runner: ubuntu-24.04
            build_image: quay.io/centos/centos:7
            elf_machine: Advanced Micro Devices X86-64
            glibc_max: '2.17'
            require_gcc_485: 'true'
            artifact_name: tte-mrcp-rhel7-x86_64
            zip_name: tte-mrcp-rhel7-x86_64.zip
            # CentOS 7 only ships CMake 2.8.12; the Autotools gate covers this row.
            run_cmake_gate: 'false'
            verify_image: rockylinux:8
          - target: kylinv10-aarch64
            runner: ubuntu-24.04-arm
            build_image: rockylinux:8
            elf_machine: AArch64
            glibc_max: '2.28'
            require_gcc_485: 'false'
            artifact_name: tte-mrcp-kylinv10-aarch64
            zip_name: tte-mrcp-kylinv10-aarch64.zip
            run_cmake_gate: 'true'
            verify_image: rockylinux:8

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and package in the target ABI baseline
        shell: bash
        env:
          BUILD_IMAGE: ${{ matrix.build_image }}
          ELF_MACHINE: ${{ matrix.elf_machine }}
          GLIBC_MAX: ${{ matrix.glibc_max }}
          REQUIRE_GCC_485: ${{ matrix.require_gcc_485 }}
          RUN_CMAKE_GATE: ${{ matrix.run_cmake_gate }}
          TARGET: ${{ matrix.target }}
          ZIP_NAME: ${{ matrix.zip_name }}
        run: |
          set -euo pipefail
          docker version
          docker run --interactive --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env ELF_MACHINE \
            --env GITHUB_WORKSPACE=/work \
            --env GLIBC_MAX \
            --env REQUIRE_GCC_485 \
            --env RUN_CMAKE_GATE \
            --env TARGET \
            --env ZIP_NAME \
            "$BUILD_IMAGE" \
            bash -seu <<'CONTAINER_SCRIPT'
          set -o pipefail

          configure_rhel7_repositories() {
            sed -i \
              -e 's|^mirrorlist=|#mirrorlist=|g' \
              -e 's|^#baseurl=http://mirror.centos.org|baseurl=https://vault.centos.org|g' \
              /etc/yum.repos.d/CentOS-*.repo
            yum clean all
          }

          install_dependencies() {
            case "$TARGET" in
              rhel7-x86_64)
                configure_rhel7_repositories
                yum -y install apr-devel apr-util-devel binutils file gcc gcc-c++ make \
                  openssl-devel pkgconfig autoconf automake diffutils git libtool unzip zip
                ;;
              kylinv10-aarch64)
                dnf -y install apr-devel apr-util-devel binutils file gcc gcc-c++ make \
                  cmake openssl-devel pkgconf-pkg-config autoconf automake diffutils git libtool unzip zip
                ;;
              *)
                echo "Unsupported target: $TARGET" >&2
                exit 1
                ;;
            esac
          }

          refresh_autotools_inputs() {
            cd "$GITHUB_WORKSPACE"
            ./bootstrap
            automake --version
            autoconf --version
          }

          install_sofia_sip() {
            local version=1.13.17
            local commit=6198851a610b7889c17e2d98fb84617bc1dd7aec
            export SOFIA_PREFIX=/opt/tte-mrcp

            git clone --depth 1 --branch "v$version" \
              https://github.com/freeswitch/sofia-sip.git /tmp/sofia-sip
            test "$(cd /tmp/sofia-sip && git rev-parse HEAD)" = "$commit"
            cd /tmp/sofia-sip
            ./bootstrap.sh
            ./configure --prefix="$SOFIA_PREFIX"
            make -j"$(getconf _NPROCESSORS_ONLN)"
            make install
            export PKG_CONFIG_PATH="$SOFIA_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            pkg-config --exists sofia-sip-ua
            pkg-config --modversion sofia-sip-ua
          }

          install_speexdsp() {
            local version=1.2.1
            local commit=1b28a0f61bc31162979e1f26f3981fc3637095c8
            export SPEEXDSP_PREFIX=/opt/tte-mrcp

            git clone --depth 1 --branch "SpeexDSP-$version" \
              https://github.com/xiph/speexdsp.git /tmp/speexdsp
            test "$(cd /tmp/speexdsp && git rev-parse HEAD)" = "$commit"
            cd /tmp/speexdsp
            ./autogen.sh
            ./configure --prefix="$SPEEXDSP_PREFIX" --disable-static --enable-shared
            make -j"$(getconf _NPROCESSORS_ONLN)"
            make install
            export PKG_CONFIG_PATH="$SPEEXDSP_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            test "$(pkg-config --modversion speexdsp)" = "$version"
          }

          elf_files() {
            find "$package_dir" -type f -print0 | while IFS= read -r -d '' candidate; do
              if file "$candidate" | grep -q ELF; then
                printf '%s\n' "$candidate"
              fi
            done
          }

          audit_elf() {
            local candidate machine version maximum
            while IFS= read -r candidate; do
              machine="$(readelf -h "$candidate" | awk -F: '/Machine:/ {gsub(/^[[:space:]]+/, "", $2); print $2}')"
              if [ "$machine" != "$ELF_MACHINE" ]; then
                echo "Unexpected ELF machine for $candidate: $machine" >&2
                exit 1
              fi
              while IFS= read -r version; do
                [ -n "$version" ] || continue
                maximum="$(printf '%s\n%s\n' "$version" "$GLIBC_MAX" | sort -V | tail -n 1)"
                if [ "$maximum" != "$GLIBC_MAX" ]; then
                  echo "$candidate requires GLIBC_$version, above GLIBC_$GLIBC_MAX" >&2
                  exit 1
                fi
              done < <(readelf --version-info "$candidate" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu || true)
            done < <(elf_files)
          }

          bundle_non_system_libraries() {
            local candidate library real_library
            : > /tmp/tte-mrcp-libraries
            while IFS= read -r candidate; do
              ldd "$candidate" | awk '/=> \// {print $3} /^\// {print $1}' >> /tmp/tte-mrcp-libraries
            done < <(elf_files)
            sort -u /tmp/tte-mrcp-libraries | while IFS= read -r library; do
              [ -n "$library" ] || continue
              case "$library" in
                "$package_dir"/lib/*|/lib*/ld-linux*|/usr/lib*/ld-linux*|/lib*/libc.so.*|/usr/lib*/libc.so.*|/lib*/libdl.so.*|/usr/lib*/libdl.so.*|/lib*/libm.so.*|/usr/lib*/libm.so.*|/lib*/libpthread.so.*|/usr/lib*/libpthread.so.*|/lib*/librt.so.*|/usr/lib*/librt.so.*)
                  continue
                  ;;
              esac
              real_library="$(readlink -f "$library")"
              cp -a "$real_library" "$package_dir/lib/"
              if [ "$library" != "$real_library" ]; then
                ln -sfn "$(basename "$real_library")" "$package_dir/lib/$(basename "$library")"
              fi
            done
          }

          stage_speexdsp_soname_chain() {
            local source_dir="$SPEEXDSP_PREFIX/lib"
            local real_library soname
            test -e "$source_dir/libspeexdsp.so"
            test -e "$source_dir/libspeexdsp.so.1"
            real_library="$(readlink -f "$source_dir/libspeexdsp.so.1")"
            test -f "$real_library"
            soname="$(readelf -d "$real_library" | awk -F'[][]' '/SONAME/ {print $2; exit}')"
            test "$soname" = libspeexdsp.so.1
            cp -a "$real_library" "$package_dir/lib/"
            ln -sfn "$(basename "$real_library")" "$package_dir/lib/libspeexdsp.so.1"
            ln -sfn libspeexdsp.so.1 "$package_dir/lib/libspeexdsp.so"
            test -e "$package_dir/lib/libspeexdsp.so"
            test -e "$package_dir/lib/libspeexdsp.so.1"
            test -f "$package_dir/lib/$(basename "$real_library")"
          }

          install_dependencies
          refresh_autotools_inputs
          install_sofia_sip
          install_speexdsp
          cd "$GITHUB_WORKSPACE"
          gcc --version
          g++ --version
          if [ "$REQUIRE_GCC_485" = true ]; then
            test "$(gcc -dumpfullversion -dumpversion)" = 4.8.5
            test "$(g++ -dumpfullversion -dumpversion)" = 4.8.5
          fi

          rm -rf build/ci package-root "$ZIP_NAME"
          mkdir -p build/ci
          cd build/ci
          configure_args=(--prefix=/opt/tte-mrcp --with-sofia-sip="$SOFIA_PREFIX")
          if [ "$TARGET" = kylinv10-aarch64 ]; then
            configure_args+=(--build=aarch64-unknown-linux-gnu)
          fi
          ../../configure "${configure_args[@]}"
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make install DESTDIR="$GITHUB_WORKSPACE/package-root"

          package_dir="$GITHUB_WORKSPACE/package-root/opt/tte-mrcp"
          test -x "$package_dir/bin/unimrcpserver"
          test -x "$package_dir/bin/umc"
          test -x "$package_dir/bin/unimrcpclient"
          test -x "$package_dir/bin/asrclient"
          test -d "$package_dir/lib"
          test -d "$package_dir/plugin"
          test -d "$package_dir/conf"
          test -d "$package_dir/data"

          export LD_LIBRARY_PATH="$package_dir/lib:$SOFIA_PREFIX/lib"
          bundle_non_system_libraries
          stage_speexdsp_soname_chain
          audit_elf

          tts_plugin="$package_dir/plugin/tts_websocket.so"
          test -f "$tts_plugin"
          speexdsp_resolved="$(LD_LIBRARY_PATH="$package_dir/lib" ldd "$tts_plugin" \
            | awk '$1 == "libspeexdsp.so.1" {print $3; exit}')"
          # libtool embeds the deploy-time prefix in the plugin RPATH. During
          # DESTDIR packaging, ldd therefore reports /opt/tte-mrcp/lib rather
          # than the temporary package-root path. The staged SONAME chain and
          # ZIP assertions below verify that this runtime library is packaged.
          test "$speexdsp_resolved" = "$SPEEXDSP_PREFIX/lib/libspeexdsp.so.1"

          # ---- Plugin unit-test gates (target ABI container) ----
          # Autotools gate: asr_websocket check_PROGRAMS (4 tests).
          make -C "$GITHUB_WORKSPACE/build/ci/plugins/asr-websocket" check \
            > "$GITHUB_WORKSPACE/check-autotools-$TARGET.log" 2>&1 || {
            tail -n 120 "$GITHUB_WORKSPACE/check-autotools-$TARGET.log"
            exit 1
          }
          # Autotools gate: tts_websocket check_PROGRAMS (resampler + stream pipeline).
          make -C "$GITHUB_WORKSPACE/build/ci/plugins/tts-websocket" check \
            >> "$GITHUB_WORKSPACE/check-autotools-$TARGET.log" 2>&1 || {
            tail -n 120 "$GITHUB_WORKSPACE/check-autotools-$TARGET.log"
            exit 1
          }
          grep -E "^(PASS|FAIL|SKIP|ERROR|XFAIL|XPASS):" \
            "$GITHUB_WORKSPACE/check-autotools-$TARGET.log" || true

          # CMake gate (kylinv10 row only): plugin tests via CTest.
          # PR checks run on the merge ref, where the tts-websocket plugin
          # registers all six TTS unit-test executables in addition to the four
          # asr_websocket tests; build every registered plugin target.
          if [ "$RUN_CMAKE_GATE" = true ]; then
            cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build/ci-cmake" \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DBUILD_ASR_WEBSOCKET_TESTS=ON \
              -DBUILD_TTS_WEBSOCKET_TESTS=ON \
              > "$GITHUB_WORKSPACE/cmake-configure-$TARGET.log" 2>&1 || {
                tail -n 120 "$GITHUB_WORKSPACE/cmake-configure-$TARGET.log"
                exit 1
              }
            cmake --build "$GITHUB_WORKSPACE/build/ci-cmake" \
              --target test_resample test_json_unescape \
                     test_funasr_ws_transport test_funasr_control \
                     test_tts_websocket_http_parse \
                     test_tts_websocket_pcm test_tts_websocket_lifecycle \
                     test_tts_websocket_resampler \
                     test_tts_websocket_stream_pipeline \
                     test_tts_websocket_ws \
              -j"$(getconf _NPROCESSORS_ONLN)" \
              > "$GITHUB_WORKSPACE/cmake-build-$TARGET.log" 2>&1 || {
                tail -n 120 "$GITHUB_WORKSPACE/cmake-build-$TARGET.log"
                exit 1
              }
            ctest --test-dir "$GITHUB_WORKSPACE/build/ci-cmake" \
              --output-on-failure \
              -R '^(asr_websocket_|tts_websocket_(http_parse|pcm|resampler|stream_pipeline|lifecycle|ws)$)' \
              > "$GITHUB_WORKSPACE/ctest-$TARGET.log" 2>&1 || {
                tail -n 120 "$GITHUB_WORKSPACE/ctest-$TARGET.log"
                exit 1
              }
          fi

          # ---- Dependency inspection: no unresolved dynamic library ----
          : > "$GITHUB_WORKSPACE/ldd-$TARGET.txt"
          while IFS= read -r candidate; do
            printf '== %s ==\n' "$candidate" >> "$GITHUB_WORKSPACE/ldd-$TARGET.txt"
            ldd "$candidate" >> "$GITHUB_WORKSPACE/ldd-$TARGET.txt" 2>&1 || true
          done < <(elf_files)
          if grep -q "not found" "$GITHUB_WORKSPACE/ldd-$TARGET.txt"; then
            echo "Unresolved dynamic dependencies:" >&2
            grep -B1 "not found" "$GITHUB_WORKSPACE/ldd-$TARGET.txt" >&2
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/package-root"
          zip -yr "$GITHUB_WORKSPACE/$ZIP_NAME" opt/tte-mrcp
          speexdsp_real_name="$(basename "$(readlink -f "$package_dir/lib/libspeexdsp.so.1")")"
          for archive_entry in \
            opt/tte-mrcp/lib/libspeexdsp.so \
            opt/tte-mrcp/lib/libspeexdsp.so.1 \
            "opt/tte-mrcp/lib/$speexdsp_real_name"; do
            # Consume the complete listing so pipefail does not turn grep's
            # early exit into an unzip SIGPIPE (exit 141).
            unzip -Z1 "$GITHUB_WORKSPACE/$ZIP_NAME" | grep -Fx "$archive_entry" > /dev/null
          done
          unzip -l "$GITHUB_WORKSPACE/$ZIP_NAME"
          CONTAINER_SCRIPT

      - name: Publish package summary
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ matrix.zip_name }}"
          {
            echo "## ${{ matrix.target }} package"
            echo
            echo "- ZIP: \`${{ matrix.zip_name }}\`"
            echo "- Artifact: \`${{ matrix.artifact_name }}\`"
            echo "- Build image: \`${{ matrix.build_image }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate package checksums and metadata
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          ZIP_NAME: ${{ matrix.zip_name }}
        run: |
          set -euo pipefail
          test -f "$ZIP_NAME"
          sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256"
          {
            printf 'artifact_name=%s\n' "$ARTIFACT_NAME"
            printf 'target=%s\n' '${{ matrix.target }}'
            printf 'zip_name=%s\n' "$ZIP_NAME"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'ref=%s\n' "$GITHUB_REF"
          } > "$ZIP_NAME.metadata"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.artifact_naming.outputs.artifact_suffix != '' && format('{0}-{1}', matrix.artifact_name, needs.artifact_naming.outputs.artifact_suffix) || matrix.artifact_name }}
          path: |
            ${{ matrix.zip_name }}
            ${{ matrix.zip_name }}.sha256
            ${{ matrix.zip_name }}.metadata
          if-no-files-found: error

  # Runtime verification of the packaged tree in a Linux container:
  # plugin load, RTP/MRCP link smoke and the 20-session ASR WebSocket loopback
  # fixture with machine-readable pacing thresholds.
  verify-linux:
    name: verify ${{ matrix.target }}
    needs: [artifact_naming, build-linux]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: rhel7-x86_64
            runner: ubuntu-24.04
            artifact_name: tte-mrcp-rhel7-x86_64
            zip_name: tte-mrcp-rhel7-x86_64.zip
            verify_image: rockylinux:8
          - target: kylinv10-aarch64
            runner: ubuntu-24.04-arm
            artifact_name: tte-mrcp-kylinv10-aarch64
            zip_name: tte-mrcp-kylinv10-aarch64.zip
            verify_image: rockylinux:8

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.artifact_naming.outputs.artifact_suffix != '' && format('{0}-{1}', matrix.artifact_name, needs.artifact_naming.outputs.artifact_suffix) || matrix.artifact_name }}
          path: artifacts

      - name: Verify package checksum
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -c "${{ matrix.zip_name }}.sha256"

      - name: Verify runtime gates in a Linux container
        shell: bash
        env:
          VERIFY_IMAGE: ${{ matrix.verify_image }}
          TARGET: ${{ matrix.target }}
          ZIP_NAME: ${{ matrix.zip_name }}
          CONCURRENCY: '20'
          FAULT_CONNECTION: '2'
        run: |
          set -euo pipefail
          test -f "artifacts/$ZIP_NAME"
          docker run --interactive --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env GITHUB_WORKSPACE=/work \
            --env TARGET \
            --env ZIP_NAME \
            --env CONCURRENCY \
            --env FAULT_CONNECTION \
            "$VERIFY_IMAGE" \
            bash -seu <<'CONTAINER_SCRIPT'
          set -o pipefail

          dnf -y install --setopt=install_weak_deps=False \
            expect python3 file findutils binutils procps-ng unzip nss-softokn-freebl
          # nss-softokn-freebl: the rhel7 package bundles CentOS 7 libcrypt
          # (DT_NEEDED libfreebl3.so), which must resolve on the verify image
          # just like it does on the target RHEL 7 / Kylin systems.
          # The fixture requires Python >= 3.7 (PEP 563 future annotations);
          # Rocky Linux 8's default python3 is 3.6, so enable the python39 module.
          dnf -y module enable python39
          dnf -y install python39
          ln -sfn /usr/bin/python3.9 /usr/local/bin/python3
          python3 --version

          cd "$GITHUB_WORKSPACE"
          rm -rf verify-root
          mkdir -p verify-root
          cd verify-root
          unzip -q "$GITHUB_WORKSPACE/artifacts/$ZIP_NAME"
          package_dir="$GITHUB_WORKSPACE/verify-root/opt/tte-mrcp"
          # LD_LIBRARY_PATH is intentionally NOT exported globally: the
          # bundled RHEL 7 libs (e.g. libcrypt -> libfreebl3) must not shadow
          # system libraries for python3/fixture. It is applied per-command
          # to the packaged binaries only.
          PACKAGE_LIB="$package_dir/lib"
          export PATH="$package_dir/bin:$PATH"
          mkdir -p "$package_dir/log" "$package_dir/var"

          # 1. Fixture self-test (stdlib only, no third-party dependencies)
          python3 "$GITHUB_WORKSPACE/tools/diagnostics/funasr_ws_fixture.py" --self-test

          # 2. Runtime dependency inspection: every ELF must resolve
          for candidate in "$package_dir"/bin/* "$package_dir"/plugin/*.so; do
            [ -f "$candidate" ] || continue
            if file "$candidate" | grep -q ELF; then
              if LD_LIBRARY_PATH="$PACKAGE_LIB" ldd "$candidate" 2>&1 | grep -q "not found"; then
                echo "Unresolved dependency for $candidate" >&2
                LD_LIBRARY_PATH="$PACKAGE_LIB" ldd "$candidate" >&2 || true
                exit 1
              fi
            fi
          done

          # 3. Emit loopback server config: exactly one canonical ASR engine -> fixture
          python3 "$GITHUB_WORKSPACE/tools/diagnostics/funasr_ws_fixture.py" \
            --emit-config "$GITHUB_WORKSPACE/conf/unimrcpserver.xml" \
            "$GITHUB_WORKSPACE/verify-unimrcpserver.xml" \
            --host 127.0.0.1 --port 8022 --path /ws/asr
          cp "$GITHUB_WORKSPACE/verify-unimrcpserver.xml" \
             "$package_dir/conf/unimrcpserver.xml"
          python3 - "$package_dir/conf/unimrcpserver.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          engines = [
              node for node in root.iter("engine")
              if node.get("id") == "ASR-WebSocket-1"
          ]
          assert len(engines) == 1
          assert engines[0].get("name") == "asr_websocket"
          params = {node.get("name"): node.get("value") for node in engines[0]}
          assert params["funasr-host"] == "127.0.0.1"
          assert params["funasr-port"] == "8022"
          assert params["funasr-path"] == "/ws/asr"
          mappings = [
              node for node in root.iter("resource")
              if node.get("id") == "speechrecog"
              and node.get("engine") is not None
          ]
          assert len(mappings) == 1
          assert mappings[0].get("engine") == "ASR-WebSocket-1"
          PY

          # 4. Start the loopback fixture with fault injection
          python3 "$GITHUB_WORKSPACE/tools/diagnostics/funasr_ws_fixture.py" \
            --host 127.0.0.1 --port 8022 --path /ws/asr \
            --mode split-payload \
            --fault-connection "$FAULT_CONNECTION" \
            --report "$GITHUB_WORKSPACE/fixture.jsonl" \
            > "$GITHUB_WORKSPACE/fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" "$server_pid" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if grep -q '"event": "listening"' "$GITHUB_WORKSPACE/fixture.log"; then
              break
            fi
            if ! kill -0 "$fixture_pid" 2>/dev/null; then
              echo "fixture exited early" >&2
              cat "$GITHUB_WORKSPACE/fixture.log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          grep -q '"event": "listening"' "$GITHUB_WORKSPACE/fixture.log"

          # 5. Start unimrcpserver from the packaged tree (console log only)
          cd "$package_dir"
          stdbuf -oL -eL env LD_LIBRARY_PATH="$PACKAGE_LIB" \
            bin/unimrcpserver \
            -r "$package_dir" -l 6 -o 1 -w \
            < /dev/null \
            > "$GITHUB_WORKSPACE/server.log" 2>&1 &
          server_pid=$!

          ready=0
          for i in $(seq 1 60); do
            if grep -q "Create MRCPv2 Profile" "$GITHUB_WORKSPACE/server.log"; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "unimrcpserver exited early" >&2
              tail -n 120 "$GITHUB_WORKSPACE/server.log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "unimrcpserver did not become ready" >&2
            tail -n 120 "$GITHUB_WORKSPACE/server.log" >&2 || true
            exit 1
          fi
          sleep 2

          # 6. Assert config/plugin load did not fail
          if grep -qE "Failed to Load UniMRCP Server Document|Failed to compose plugin path" \
             "$GITHUB_WORKSPACE/server.log"; then
            echo "server config/plugin load failure" >&2
            exit 1
          fi

          # 7. UMC wrapper expected by the stress script: injects the packaged
          # library path only for umc, leaving python3/expect untouched.
          mkdir -p "$GITHUB_WORKSPACE/platforms/umc"
          printf '%s\n' \
            '#!/bin/bash' \
            "export LD_LIBRARY_PATH=\"$PACKAGE_LIB\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}\"" \
            "exec \"$PACKAGE_LIB/../bin/umc\" \"\$@\"" \
            > "$GITHUB_WORKSPACE/platforms/umc/umc"
          chmod +x "$GITHUB_WORKSPACE/platforms/umc/umc"

          # 8. 20-concurrent split-payload loopback experiment (1 warmup)
          cd "$GITHUB_WORKSPACE"
          bash tools/stress/stress_test_improved.sh \
            -t asr -c "$CONCURRENCY" -i 1 \
            -r "$GITHUB_WORKSPACE" \
            -a "$GITHUB_WORKSPACE/data" \
            --server-log="$GITHUB_WORKSPACE/server.log" \
            --fixture-report="$GITHUB_WORKSPACE/fixture.jsonl" \
            --pacing-json="$GITHUB_WORKSPACE/pacing.json" \
            --warmup=1 \
            --fault-connection="$FAULT_CONNECTION"

          # 9. Assert ASR WebSocket pacing acceptance thresholds
          python3 - "$GITHUB_WORKSPACE/pacing.json" "$CONCURRENCY" <<'PY'
          import json
          import sys

          pacing_path, expected_requests = sys.argv[1], int(sys.argv[2])
          with open(pacing_path, encoding="utf-8") as handle:
              report = json.load(handle)
          problems = []
          if report.get("requests") != expected_requests:
              problems.append(f"requests={report.get('requests')} != {expected_requests}")
          if report.get("overrun_events", -1) != 0:
              problems.append(f"overrun_events={report.get('overrun_events')}")
          if report.get("abnormal_closes", -1) != 0:
              problems.append(f"abnormal_closes={report.get('abnormal_closes')}")
          if report.get("successes", -1) < expected_requests - 1:
              problems.append(f"successes={report.get('successes')} < {expected_requests - 1}")
          p99 = report.get("nonfault_frame_gap_p99_ms")
          maximum = report.get("nonfault_frame_gap_max_ms")
          if p99 is not None and p99 >= 100:
              problems.append(f"nonfault_frame_gap_p99_ms={p99} >= 100")
          if maximum is not None and maximum >= 250:
              problems.append(f"nonfault_frame_gap_max_ms={maximum} >= 250")
          if problems:
              print(json.dumps(report, ensure_ascii=False, indent=2))
              raise SystemExit("\n".join(problems))
          print(
              "pacing gate OK: "
              f"requests={report.get('requests')} successes={report.get('successes')} "
              f"p99={p99}ms max={maximum}ms overrun={report.get('overrun_events')}"
          )
          PY

          # The stress-test server and fixture have served their purpose.
          # The E2E gate below starts its own unimrcpserver and per-service
          # fixtures on the same SIP/MRCP/RTSP ports, so the stress
          # processes must be torn down first.  Without this the second
          # server logs "Failed to Create Listening Socket" / "Failed to
          # Run Sofia-SIP Task" and the UMC driver receives RESULT:NODATA.
          #
          # Tear-down protocol: SIGTERM first, then wait up to 5 seconds;
          # if either process is still alive, escalate to SIGKILL.  This
          # avoids hanging the job if a process ignores SIGTERM (unimrcpserver
          # in particular has been observed to linger in shutdown).
          kill "$server_pid" "$fixture_pid" 2>/dev/null || true
          for wait_i in 1 2 3 4 5; do
            kill -0 "$server_pid" 2>/dev/null || kill -0 "$fixture_pid" 2>/dev/null || break
            sleep 1
          done
          kill -0 "$server_pid" 2>/dev/null && kill -9 "$server_pid" 2>/dev/null || true
          kill -0 "$fixture_pid" 2>/dev/null && kill -9 "$fixture_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          wait "$fixture_pid" 2>/dev/null || true
          # Reclaim the stress log so the E2E runner gets a clean server.log
          # path; the file is recreated inside the loop per mode.
          rm -f "$GITHUB_WORKSPACE/server.log"

          # 10. TTS 20-concurrent stress test
          #     websocket_e2e_fixture.py --emit-config patches both TTS and ASR engine
          #     endpoints in the server XML.  Only the TTS mock is started because
          #     TTS sessions never trigger the ASR engine.
          python3 "$GITHUB_WORKSPACE/tools/diagnostics/websocket_e2e_fixture.py" \
            --emit-config "$GITHUB_WORKSPACE/conf/unimrcpserver.xml" \
              "$GITHUB_WORKSPACE/tts-unimrcpserver.xml" \
            --host 127.0.0.1 --tts-port 18091 --asr-port 18022
          cp "$GITHUB_WORKSPACE/tts-unimrcpserver.xml" "$package_dir/conf/unimrcpserver.xml"

          python3 "$GITHUB_WORKSPACE/tools/diagnostics/websocket_e2e_fixture.py" \
            --service tts --host 127.0.0.1 --port 18091 --mode normal \
            --report "$GITHUB_WORKSPACE/tts_fixture.jsonl" \
            > "$GITHUB_WORKSPACE/tts_fixture.log" 2>&1 &
          tts_fixture_pid=$!

          for i in $(seq 1 15); do
            if grep -q '"event": "listening"' "$GITHUB_WORKSPACE/tts_fixture.log" 2>/dev/null; then
              break
            fi
            if ! kill -0 "$tts_fixture_pid" 2>/dev/null; then
              echo "TTS fixture exited early" >&2
              cat "$GITHUB_WORKSPACE/tts_fixture.log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          grep -q '"event": "listening"' "$GITHUB_WORKSPACE/tts_fixture.log"

          cd "$package_dir"
          stdbuf -oL -eL env LD_LIBRARY_PATH="$PACKAGE_LIB" \
            bin/unimrcpserver -r "$package_dir" -l 6 -o 1 -w \
            < /dev/null > "$GITHUB_WORKSPACE/tts_server.log" 2>&1 &
          tts_server_pid=$!

          tts_ready=0
          for i in $(seq 1 60); do
            if grep -q "Create MRCPv2 Profile" "$GITHUB_WORKSPACE/tts_server.log" 2>/dev/null; then
              tts_ready=1; break
            fi
            if ! kill -0 "$tts_server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$tts_ready" != 1 ]; then
            echo "tts_server did not become ready" >&2
            tail -n 120 "$GITHUB_WORKSPACE/tts_server.log" >&2 || true
            exit 1
          fi
          sleep 2

          cd "$GITHUB_WORKSPACE"
          bash tools/stress/stress_test_improved.sh \
            -t tts -c "$CONCURRENCY" -i 1 \
            -r "$GITHUB_WORKSPACE" \
            --tts-save --tts-var-dir "$GITHUB_WORKSPACE/var"

          # Assert TTS fixture outcomes: every session must complete with audio
          python3 - "$GITHUB_WORKSPACE/tts_fixture.jsonl" "$CONCURRENCY" << 'PY'
          import json, sys
          fixture_path, expected = sys.argv[1], int(sys.argv[2])
          sessions = []
          with open(fixture_path) as f:
              for line in f:
                  line = line.strip()
                  if line:
                      sessions.append(json.loads(line))
          tts = [s for s in sessions if s.get("service") == "tts"]
          problems = []
          if len(tts) < expected:
              problems.append(f"tts_sessions={len(tts)} < {expected}")
          bad = [s for s in tts if s.get("outcome") != "final-sent"]
          if bad:
              outcomes = [s.get("outcome") for s in bad]
              problems.append(f"{len(bad)} sessions had outcome != final-sent: {outcomes}")
          no_audio = [s for s in tts if s.get("audio_bytes", 0) == 0]
          if no_audio:
              problems.append(f"{len(no_audio)} sessions sent 0 audio bytes")
          if problems:
              print(json.dumps(tts, ensure_ascii=False, indent=2))
              raise SystemExit("\n".join(problems))
          total_bytes = sum(s.get("audio_bytes", 0) for s in tts)
          print(
              "TTS stress gate OK: "
              f"sessions={len(tts)} total_audio_bytes={total_bytes}"
          )
          PY

          kill "$tts_server_pid" "$tts_fixture_pid" 2>/dev/null || true
          for wait_i in 1 2 3 4 5; do
            kill -0 "$tts_server_pid" 2>/dev/null \
              || kill -0 "$tts_fixture_pid" 2>/dev/null \
              || break
            sleep 1
          done
          kill -0 "$tts_server_pid" 2>/dev/null && kill -9 "$tts_server_pid" 2>/dev/null || true
          kill -0 "$tts_fixture_pid" 2>/dev/null && kill -9 "$tts_fixture_pid" 2>/dev/null || true
          wait "$tts_server_pid" 2>/dev/null || true
          wait "$tts_fixture_pid" 2>/dev/null || true
          rm -f "$GITHUB_WORKSPACE/tts_server.log"

          # 11. Mixed TTS+ASR 20-concurrent stress test (10 TTS + 10 ASR simultaneously)
          #     stress_test_improved.sh -t mixed: even worker IDs -> TTS, odd -> ASR.
          #     Port allocation is by worker_id so no SIP/RTP conflicts occur.
          python3 "$GITHUB_WORKSPACE/tools/diagnostics/websocket_e2e_fixture.py" \
            --emit-config "$GITHUB_WORKSPACE/conf/unimrcpserver.xml" \
              "$GITHUB_WORKSPACE/mixed-unimrcpserver.xml" \
            --host 127.0.0.1 --tts-port 18091 --asr-port 18022
          cp "$GITHUB_WORKSPACE/mixed-unimrcpserver.xml" "$package_dir/conf/unimrcpserver.xml"

          python3 "$GITHUB_WORKSPACE/tools/diagnostics/websocket_e2e_fixture.py" \
            --service tts --host 127.0.0.1 --port 18091 --mode normal \
            > "$GITHUB_WORKSPACE/mixed_tts_fixture.log" 2>&1 &
          mixed_tts_pid=$!

          python3 "$GITHUB_WORKSPACE/tools/diagnostics/websocket_e2e_fixture.py" \
            --service asr --host 127.0.0.1 --port 18022 --mode normal \
            > "$GITHUB_WORKSPACE/mixed_asr_fixture.log" 2>&1 &
          mixed_asr_pid=$!

          for i in $(seq 1 15); do
            grep -q '"event": "listening"' "$GITHUB_WORKSPACE/mixed_tts_fixture.log" 2>/dev/null \
              && grep -q '"event": "listening"' "$GITHUB_WORKSPACE/mixed_asr_fixture.log" 2>/dev/null \
              && break
            sleep 1
          done

          cd "$package_dir"
          stdbuf -oL -eL env LD_LIBRARY_PATH="$PACKAGE_LIB" \
            bin/unimrcpserver -r "$package_dir" -l 6 -o 1 -w \
            < /dev/null > "$GITHUB_WORKSPACE/mixed_server.log" 2>&1 &
          mixed_server_pid=$!

          mixed_ready=0
          for i in $(seq 1 60); do
            if grep -q "Create MRCPv2 Profile" "$GITHUB_WORKSPACE/mixed_server.log" 2>/dev/null; then
              mixed_ready=1; break
            fi
            if ! kill -0 "$mixed_server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$mixed_ready" != 1 ]; then
            echo "mixed_server did not become ready" >&2
            tail -n 120 "$GITHUB_WORKSPACE/mixed_server.log" >&2 || true
            exit 1
          fi
          sleep 2

          cd "$GITHUB_WORKSPACE"
          bash tools/stress/stress_test_improved.sh \
            -t mixed -c "$CONCURRENCY" -i 1 \
            -r "$GITHUB_WORKSPACE" \
            -a "$GITHUB_WORKSPACE/data" \
            --tts-save --tts-var-dir "$GITHUB_WORKSPACE/var"

          kill "$mixed_server_pid" "$mixed_tts_pid" "$mixed_asr_pid" 2>/dev/null || true
          for wait_i in 1 2 3 4 5; do
            kill -0 "$mixed_server_pid" 2>/dev/null \
              || kill -0 "$mixed_tts_pid" 2>/dev/null \
              || kill -0 "$mixed_asr_pid" 2>/dev/null \
              || break
            sleep 1
          done
          for _spid in "$mixed_server_pid" "$mixed_tts_pid" "$mixed_asr_pid"; do
            kill -0 "$_spid" 2>/dev/null && kill -9 "$_spid" 2>/dev/null || true
          done
          wait "$mixed_server_pid" "$mixed_tts_pid" "$mixed_asr_pid" 2>/dev/null || true
          rm -f "$GITHUB_WORKSPACE/mixed_server.log"

          # 12. Rapid successive session test (resource-cleanup and anti-deadlock gate)
          #     rapid_stop_test.sh: 5 workers x 5 cycles of complete sessions back-to-back.
          #     Validates no deadlock (timeout), no server crash, and no resource leak.
          python3 "$GITHUB_WORKSPACE/tools/diagnostics/websocket_e2e_fixture.py" \
            --emit-config "$GITHUB_WORKSPACE/conf/unimrcpserver.xml" \
              "$GITHUB_WORKSPACE/rapid-unimrcpserver.xml" \
            --host 127.0.0.1 --tts-port 18091 --asr-port 18022
          cp "$GITHUB_WORKSPACE/rapid-unimrcpserver.xml" "$package_dir/conf/unimrcpserver.xml"

          python3 "$GITHUB_WORKSPACE/tools/diagnostics/websocket_e2e_fixture.py" \
            --service tts --host 127.0.0.1 --port 18091 --mode normal \
            > "$GITHUB_WORKSPACE/rapid_tts_fixture.log" 2>&1 &
          rapid_tts_pid=$!

          python3 "$GITHUB_WORKSPACE/tools/diagnostics/websocket_e2e_fixture.py" \
            --service asr --host 127.0.0.1 --port 18022 --mode normal \
            > "$GITHUB_WORKSPACE/rapid_asr_fixture.log" 2>&1 &
          rapid_asr_pid=$!

          for i in $(seq 1 15); do
            grep -q '"event": "listening"' "$GITHUB_WORKSPACE/rapid_tts_fixture.log" 2>/dev/null \
              && grep -q '"event": "listening"' "$GITHUB_WORKSPACE/rapid_asr_fixture.log" 2>/dev/null \
              && break
            sleep 1
          done

          cd "$package_dir"
          stdbuf -oL -eL env LD_LIBRARY_PATH="$PACKAGE_LIB" \
            bin/unimrcpserver -r "$package_dir" -l 6 -o 1 -w \
            < /dev/null > "$GITHUB_WORKSPACE/rapid_server.log" 2>&1 &
          rapid_server_pid=$!

          rapid_ready=0
          for i in $(seq 1 60); do
            if grep -q "Create MRCPv2 Profile" "$GITHUB_WORKSPACE/rapid_server.log" 2>/dev/null; then
              rapid_ready=1; break
            fi
            if ! kill -0 "$rapid_server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$rapid_ready" != 1 ]; then
            echo "rapid_server did not become ready" >&2
            tail -n 120 "$GITHUB_WORKSPACE/rapid_server.log" >&2 || true
            exit 1
          fi
          sleep 2

          cd "$GITHUB_WORKSPACE"
          UMC_BIN="$GITHUB_WORKSPACE/platforms/umc/umc" \
          SERVER_LOG="$GITHUB_WORKSPACE/rapid_server.log" \
            bash tools/stress/rapid_stop_test.sh \
              -t tts -c 5 -r "$GITHUB_WORKSPACE" --cycles=5
          UMC_BIN="$GITHUB_WORKSPACE/platforms/umc/umc" \
          SERVER_LOG="$GITHUB_WORKSPACE/rapid_server.log" \
            bash tools/stress/rapid_stop_test.sh \
              -t asr -c 5 -r "$GITHUB_WORKSPACE" --cycles=5 \
              -a "$GITHUB_WORKSPACE/data"

          kill "$rapid_server_pid" "$rapid_tts_pid" "$rapid_asr_pid" 2>/dev/null || true
          for wait_i in 1 2 3 4 5; do
            kill -0 "$rapid_server_pid" 2>/dev/null \
              || kill -0 "$rapid_tts_pid" 2>/dev/null \
              || kill -0 "$rapid_asr_pid" 2>/dev/null \
              || break
            sleep 1
          done
          for _spid in "$rapid_server_pid" "$rapid_tts_pid" "$rapid_asr_pid"; do
            kill -0 "$_spid" 2>/dev/null && kill -9 "$_spid" 2>/dev/null || true
          done
          wait "$rapid_server_pid" "$rapid_tts_pid" "$rapid_asr_pid" 2>/dev/null || true
          rm -f "$GITHUB_WORKSPACE/rapid_server.log"

          # 13. Production-plugin E2E: packaged TTS and ASR binaries/plugins
          # exchange real WebSocket frames with loopback doubles.  This is
          # intentionally separate from the pacing gate so a passing stress
          # run cannot mask a missing TTS plugin or a bad MRCP completion.
          # Exercise normal framing, short reads, delayed framing, and
          # early remote connection closure.
          for e2e_mode in normal split slow close; do
            E2E_WORK_DIR="$GITHUB_WORKSPACE/websocket-e2e-results/$e2e_mode" \
              PACKAGE_DIR="$package_dir" ROOT_DIR="$GITHUB_WORKSPACE" \
              E2E_MODE="$e2e_mode" \
              bash "$GITHUB_WORKSPACE/tools/diagnostics/run_websocket_e2e.sh"
          done
          CONTAINER_SCRIPT

      - name: Publish verify summary
        shell: bash
        run: |
          set -euo pipefail
          test -f pacing.json
          {
            echo "## ${{ matrix.target }} runtime verification"
            echo
            echo "- Package: \`${{ matrix.zip_name }}\`"
            echo "- Verify image: \`${{ matrix.verify_image }}\`"
            echo "- 20 concurrent ASR sessions + 1 warmup, split-payload fault on connection 2"
            echo "- 20 concurrent TTS sessions (outcome + audio-bytes gate)"
            echo "- 20 concurrent mixed TTS+ASR sessions (10+10 interleaved)"
            echo "- Rapid successive session test (5 workers x 5 cycles, TTS + ASR)"
            echo
            echo "### ASR Pacing report"
            echo '```json'
            cat pacing.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-verify-evidence
          path: |
            server.log
            fixture.log
            fixture.jsonl
            pacing.json
            tts_fixture.jsonl
            tts_fixture.log
            mixed_tts_fixture.log
            mixed_asr_fixture.log
            rapid_tts_fixture.log
            rapid_asr_fixture.log
            stress_results/
            rapid_stop_results/
            websocket-e2e-results/
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: [artifact_naming, verify-linux]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download x86_64 package
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.artifact_naming.outputs.artifact_suffix != '' && format('{0}-{1}', 'tte-mrcp-rhel7-x86_64', needs.artifact_naming.outputs.artifact_suffix) || 'tte-mrcp-rhel7-x86_64' }}
          path: release-assets/rhel7-x86_64

      - name: Download aarch64 package
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.artifact_naming.outputs.artifact_suffix != '' && format('{0}-{1}', 'tte-mrcp-kylinv10-aarch64', needs.artifact_naming.outputs.artifact_suffix) || 'tte-mrcp-kylinv10-aarch64' }}
          path: release-assets/kylinv10-aarch64

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/rhel7-x86_64/*.zip
            release-assets/rhel7-x86_64/*.sha256
            release-assets/rhel7-x86_64/*.metadata
            release-assets/kylinv10-aarch64/*.zip
            release-assets/kylinv10-aarch64/*.sha256
            release-assets/kylinv10-aarch64/*.metadata
